name: gameon-dev

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: gameon
      POSTGRES_PASSWORD: Demo1234
      POSTGRES_DB: gameon
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameon -d gameon"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: development
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gameon:Demo1234@db:5432/gameon
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-8080}}
      JWT_SECRET: ${JWT_SECRET:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
    volumes:
      - .:/app
    command: >-
      sh -c 'npm ci &&
      npx prisma generate --schema apps/api/prisma/schema.prisma &&
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      exec npm run dev --workspace @gameon/api'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      start_period: 60s
      retries: 30

  web:
    build:
      context: .
      target: development
    init: true
    command: npm run dev --workspace @gameon/web
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database:
