name: gameon-prod

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: gameon
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameon -d gameon"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/zix3r/gameon-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      target: api
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gameon:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/gameon
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 30

  web:
    image: ghcr.io/zix3r/gameon-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      target: web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certificates:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database:
  certificates:
  caddy-config:
