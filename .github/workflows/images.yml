name: Production images

on: [push, workflow_dispatch]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      DB_PASSWORD: gameon_ci_database
      JWT_SECRET: gameon-ci-only-secret-not-for-production
      APP_ORIGIN: http://localhost:8080
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: ghcr.io/zix3r/gameon-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/zix3r/gameon
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          tags: ghcr.io/zix3r/gameon-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/zix3r/gameon
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verify production stack
        run: |
          docker compose -f compose.prod.yaml up --no-build -d --wait --wait-timeout 120
          docker compose -f compose.prod.yaml exec -T api npm run check
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/games > /dev/null
          curl --fail http://localhost:8080/favicon.svg > /dev/null
      - name: Publish verified images
        if: github.ref == 'refs/heads/main'
        run: |
          for service in api web; do
            image="ghcr.io/zix3r/gameon-$service"
            docker push "$image:$IMAGE_TAG"
            docker tag "$image:$IMAGE_TAG" "$image:latest"
            docker push "$image:latest"
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.prod.yaml down --volumes

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: images
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/vm.yml
    with:
      image_tag: ${{ github.sha }}
